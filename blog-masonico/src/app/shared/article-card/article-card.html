<mat-card>
  <img mat-card-image [src]="article().coverImage" [alt]="article().title" loading="lazy">
  <mat-card-header>
    <mat-chip-set>
      <mat-chip>{{ article().category }}</mat-chip>
    </mat-chip-set>
    <mat-card-title>{{ article().title }}</mat-card-title>
    <mat-card-subtitle>
      {{ article().author }} · {{ article().publishedAt | date:'d MMM y' }}
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>{{ article().excerpt }}</p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button [routerLink]="['/articulos', article().slug]">Leer más</a>
  </mat-card-actions>
</mat-card>
